<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECRET ROOM</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #101116;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.phone {
  width: 100%;
  max-width: 350px;
  min-height: 570px;
  border: 1px solid #383943;
  border-radius: 30px;
  padding: 30px 22px;
  text-align: center;
  background: #191a21;
  box-shadow: 0 15px 50px #0008;
}
.date {
  color: #999ba8;
  font-size: 13px;
  letter-spacing: 3px;
  margin-top: 35px;
}
h1 {
  font-size: 32px;
  letter-spacing: 5px;
  margin-top: 45px;
}
.subtitle {
  color: #a5a5b0;
  font-size: 13px;
  line-height: 1.8;
}
input {
  width: 100%;
  margin-top: 30px;
  padding: 15px;
  border: 1px solid #484957;
  border-radius: 12px;
  background: #101116;
  color: white;
  text-align: center;
  font-size: 18px;
  letter-spacing: 5px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border: none;
  border-radius: 12px;
  background: #e8e5df;
  color: #17171b;
  font-weight: bold;
  letter-spacing: 2px;
}
#message {
  display: none;
  margin-top: 35px;
  line-height: 1.8;
  color: #dedbe5;
  font-size: 14px;
}
.footer {
  margin-top: 55px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #777986;
}
</style>
</head>
<body>
<div class="phone">
  <div class="date">11:16 PM · UNKNOWN</div>
  <h1>SECRET ROOM</h1>
  <p class="subtitle">
    Some memories are locked for a reason.<br>
    Do you remember the password?
  </p>
  <input
    type="password"
    id="password"
    placeholder="••••"
    inputmode="numeric"
  >
  <button onclick="unlock()">UNLOCK</button>
  <p id="message">
    You've found me.<br><br>
    Funny how some doors never really close.<br>
    They just wait for someone to remember.
  </p>
  <div class="footer">PRIVATE ARCHIVE · 001</div>
</div>
<script>
function unlock() {
  const password = document.getElementById("password").value;
  if (password === "2310") {
    document.getElementById("message").style.display = "block";
  } else {
    alert("Wrong password. Try again.");
  }
}
</script>
</body>
</html>
